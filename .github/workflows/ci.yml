name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/tiller-router

  container-regressions:
    name: Browser and runtime checks
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Run browser checks
        run: ./tests/browser/run.sh
      - name: Upload browser debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-debug
          path: |
            test-debug/
            test-results/
          if-no-files-found: ignore
          retention-days: 3
      - name: Run read-only runtime checks
        run: ./tests/runtime-readonly.sh
